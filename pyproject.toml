[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-insights"
version = "0.1.0"
description = "Medallion lakehouse over the Enron email corpus on Databricks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shawn D'Souza" }]
# PySpark is provided by the Databricks runtime, so it is only a dev dependency.
dependencies = []

[project.optional-dependencies]
dev = [
    "pyspark==4.2.0",
    "numpy",  # needed by pyspark.ml
    "pandas<3",  # PySpark 4.2 does not fully support pandas 3 yet
    "matplotlib",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Globals that Databricks injects into every notebook.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
